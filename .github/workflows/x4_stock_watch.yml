name: X4 stock watch

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: x4-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests curl_cffi

      - name: Check stock
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python x4_stock_watch.py --ci

      - name: Status ping
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d disable_notification=true \
            -d text="✅ X4 watcher chal raha hai (${{ job.status }})"

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain x4_state.json)" ]; then
            git config user.name "x4-bot"
            git config user.email "x4-bot@users.noreply.github.com"
            git add x4_state.json
            git commit -m "update state [skip ci]"
            git push
          fi
